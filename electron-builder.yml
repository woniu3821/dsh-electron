appId: com.deepseek.dsh-electron
productName: DeepSeek Harness Desktop
# The app payload is small (out/ + package.json); the dsh runtime rides in
# extraResources. asar keeps the app files in one archive — explicit here
# because the main process loads them via Electron's asar-aware fs.
asar: true
# The main process spawns dsh with ELECTRON_RUN_AS_NODE=1 (Electron's embedded
# Node 24), so the RunAsNode fuse must stay enabled; pin it explicitly so a
# future Electron default flip cannot silently break packaged builds.
electronFuses:
  runAsNode: true
# win-unpacked carries the bundled dsh runtime (~700MB, ~32k files;
# scripts/bundle-dsh.mjs slims it in place to ~17k files). Compressing
# with LZMA maximum makes NSIS itself very slow; store makes the installer huge
# (reads back all 700MB on install, slow). normal is the best trade-off for
# both build time and install time.
compression: normal
# No electronDist: electron-builder must download the per-arch Electron build
# (cached under ~/Library/Caches/electron), otherwise every architecture gets
# the host's local Electron distribution. The zip downloads go through
# electronDownload.mirror (npmmirror) instead of github.com releases — github
# is unreliably slow on throttled networks and stalls the build.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  # The deployed dsh runtime only (no standalone Node — the app runs dsh with
  # Electron's own embedded Node 24 via ELECTRON_RUN_AS_NODE, see
  # src/main/index.ts). Filled by `pnpm run prepare:runtime`, which copies the
  # flattened + slimmed resources/dsh-<arch> payload that `pnpm run bundle`
  # produces.
  #
  # `to: dsh` (not a deeper name) keeps the installed tree short — the runtime
  # carries deep @opentelemetry paths, and NSIS extraction plus Explorer's
  # unzip both fail past Windows' 260-char MAX_PATH.
  #
  # `from` is resources/dsh (NOT .../runtime) so the runtime's node_modules is
  # a SUB-directory of the copy source: electron-builder's file filter
  # hard-excludes a source's root-level node_modules, which would drop the
  # entire bundled dsh runtime (and with it lib/bin.js). The filter keeps the
  # copy to the runtime subtree.
  - from: resources/dsh
    to: dsh
    filter:
      - runtime{,/**/*}
mac:
  target:
    - dmg
    - zip
  # Per-arch artifact names: package:mac packs x64 and arm64 in two runs.
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
win:
  target:
    - nsis
    - zip
  # No code-signing certificate is configured; explicitly skip the signing
  # step. Otherwise electron-builder still walks the sign pipeline (fetching
  # winCodeSign tooling and contacting the timestamp server), which stalls on
  # restricted networks.
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # The bundled runtime is ~17k small files after slimming; solid LZMA
  # compression is single-threaded and very slow on that payload, while
  # per-file zip (useZip) builds and installs far faster at a modest size
  # cost. No update server exists, so blockmaps (differentialPackage) add
  # nothing — disable them to keep the installer itself lean.
  differentialPackage: false
  useZip: true
linux:
  target:
    - AppImage
    - deb
  category: Development
npmRebuild: false
# electron-builder 26.15.3 matches locale file names literally: macOS .lproj
# dirs use underscores (zh_CN.lproj) while Windows/Linux .pak files use
# hyphens (zh-CN.pak), and "zh-CN" does not match "zh_CN" (and vice versa).
# Both spellings are listed so zh-CN actually ships on every platform; the
# stray entry is simply absent on the other platform's locale set.
electronLanguages:
  - en
  - zh-CN
  - zh_CN
